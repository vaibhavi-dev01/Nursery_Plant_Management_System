<html>
<head>
    <title>🌱My Nursery</title>
    <style>
        #img {
            width: 1300px;
            opacity: 0;
            animation: fadeIn 2s ease-in forwards;
        } 
        #img:hover {
            transform: scale(1.1);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <img src="/static/order.webp" id="img">
</body>
</html>
