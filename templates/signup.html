<html>
<head>
	<title>🌱My Nursery</title>
	<style>
	body
	{
		background-image:url("/static/p7.jpg");
		background-position:center;
		background-repeat: no-repeat;
		background-size:cover;
	}
	#div
	{
		width:270px;
		height:350px;
		background-color: white;
		opacity: 0.8;
		margin-left: 500px;
		margin-top:100px;
		border:2px black solid;
		border-radius:30px 0px;
		box-shadow:2px 2px 1px greenyellow;
	}
	#img1
	{
		height:80px;
		width:80px;
		margin-top:-40px;
		margin-left:90px;
		border-radius:100%;
	}
	#in
	{
		width:200px;
		margin-left:20px;
		padding:7px;
		border-left: none;
		border-right: none;
		border-top:none;
	}
	#bu
	{
		margin-left:95px;
		margin-top:20px;
		border-radius:10px;
		font-weight:bold;	
		padding:3px;
	}
	#bu:hover
	{
		color:white;
		background-color:black;
		border:2px solid yellow;
	}
	#img2
	{
		width:200px;
		height:75px;
		margin-bottom:200px;
		margin-left:38px;
		
	}
	</style>
</head>
<body>
    {% include 'main_nav.html'%}
	<div id="div">
		<form action=" " method="post">
		{%csrf_token%}
		<img id="img1" src="/static/userlogo.webp">
	<h2 align="center">SignUp Window</h2>
	<input type="text" placeholder="Enter the Name" required id="in" name="name">
	<input type="email" placeholder="Enter the Email" required id="in" name="email">
	<input type="text" placeholder="Enter the Mobile No" required id="in" name="mobile">
	<input type="password" placeholder="Enter the Password" required id="in" name="pass1">
	<input type="password" placeholder="Confirm Password" required id="in" name="cpass">
	<button type="submit" id="bu">Signup</button>
	{% if e %}
    <h4 style="color:red; text-align:center; margin-top:2;">{{ e }} <a href="/login">Login</a></h4>
	{% endif %}
	{% if e1 %}
    <h3 style="color:red; text-align:center; margin-top:2;">{{ e1 }}</h3>
	{% endif %}
	</form>
</div>
</body>
</html>
